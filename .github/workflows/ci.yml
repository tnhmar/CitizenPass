name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci --watchAll=false

  build-android:
    name: Build Android APK (local, manual trigger only)
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Align Expo SDK patch versions (fixes expo-module-gradle-plugin bug)
        run: npx expo install --fix
        env:
          CI: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: DEBUG - inspect expo module versions and generated gradle files
        run: |
          echo "===== npm ls expo/expo-modules-core/expo-modules-autolinking ====="
          npm ls expo expo-modules-core expo-modules-autolinking --all || true
          echo "===== android/settings.gradle ====="
          cat android/settings.gradle
          echo "===== android/gradle/wrapper/gradle-wrapper.properties ====="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "===== android/build.gradle ====="
          cat android/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK locally with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizenpass-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
