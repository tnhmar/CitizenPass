name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci --watchAll=false

  build-android:
    name: Build Android APK (EAS)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > android-build.json

      - name: Extract Android artifact URL
        id: android-artifact
        run: |
          URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('android-build.json','utf8'))[0].artifacts.buildUrl)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L "${{ steps.android-artifact.outputs.url }}" -o citizenpass.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizenpass-android-apk
          path: citizenpass.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA (EAS, ad-hoc)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA
        run: eas build --platform ios --profile preview --non-interactive --wait --json > ios-build.json

      - name: Extract iOS artifact URL
        id: ios-artifact
        run: |
          URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('ios-build.json','utf8'))[0].artifacts.buildUrl)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download IPA
        run: curl -L "${{ steps.ios-artifact.outputs.url }}" -o citizenpass.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizenpass-ios-ipa
          path: citizenpass.ipa
          retention-days: 14
