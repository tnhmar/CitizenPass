<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- CitizenPass app icon: a single, bold, red maple leaf on a plain
       white background - "the most popular symbol of Canada, nothing
       else" (per the 2026-09 icon redesign). Red (#FF0000) on white
       directly reproduces the flag's own central emblem color pairing.
       No badge, no stamp circle, no checkmark, no separate background
       shape - deliberately simpler than the icon this replaced.
       Leaf is vertically and horizontally centered with even margins
       (~160px top/bottom at this 1024 canvas size).

       This file is the main icon export (background baked in). See
       icon-foreground-source.svg for the Android adaptive-icon
       foreground layer (leaf only, transparent, scaled down for the
       adaptive-icon safe zone). Regenerate both PNGs with:
         node -e "require('sharp')('assets/icon-source.svg').resize(1024,1024).png().toFile('assets/icons/icon.png')"
         node -e "require('sharp')('assets/icon-foreground-source.svg').resize(1024,1024).png().toFile('assets/icons/adaptive-icon-foreground.png')"
  -->
  <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF" />
  <path d="M 512.0 160.0 L 637.6 279.0 L 733.2 262.0 L 749.2 391.0 L 853.7 408.3 L 795.7 519.3 L 838.0 567.2 L 760.0 616.1 L 770.7 654.5 L 671.5 654.4 L 559.3 663.0 L 512.0 865.2 L 464.7 663.0 L 352.5 654.4 L 253.3 654.5 L 264.0 616.1 L 186.0 567.2 L 228.3 519.3 L 170.3 408.3 L 274.8 391.0 L 290.8 262.0 L 386.4 279.0 Z" fill="#FF0000" />
